<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #ddd; background: transparent; margin: 8px; }
  label { display: flex; align-items: center; gap: 10px; }
  input { width: 70px; padding: 4px 6px; background: #2a2a30; color: #eee; border: 1px solid #555; border-radius: 4px; }
  .hint { color: #999; margin-top: 6px; }
</style>
</head>
<body>
  <label>Step (% per tick/press) <input id="step" type="number" min="1" max="50" step="1"></label>
  <div class="hint" id="hint"></div>
<script>
  let ws, uuid, settings = {};
  function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
    uuid = inUUID;
    const ai = JSON.parse(actionInfo);
    settings = (ai.payload && ai.payload.settings) || {};
    const isDial = (ai.action || '').endsWith('.dial');
    const def = isDial ? 2 : 5;
    document.getElementById('hint').textContent = 'Default: ' + def + '%';
    const input = document.getElementById('step');
    input.value = settings.step || def;
    ws = new WebSocket('ws://127.0.0.1:' + port);
    ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid: inUUID }));
    input.addEventListener('change', () => {
      const v = Math.max(1, Math.min(50, parseInt(input.value, 10) || def));
      input.value = v;
      settings.step = v;
      ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
    });
  }
</script>
</body>
</html>
